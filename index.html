<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6ece6">
<title>قشنگ‌ترین گل دنیا</title>
<meta name="description" content="یه سورپرایز کوچیک برای روز دختر">
<meta property="og:title" content="یه سوال مهم؟">
<meta property="og:description" content="به نظرت قشنگ‌ترین گل کدومه؟">
<meta property="og:image" content="images/bg-intro.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/vazirmatn-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="images/bg-intro.jpg" as="image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- ۱) معرفی -->
  <section class="screen active" id="s-intro" style="--ar:329/502" aria-label="معرفی">
    <img class="bgfill" src="images/bg-intro.jpg" alt="" aria-hidden="true">
    <div class="canvas">
      <img class="bg" src="images/bg-intro.jpg" alt="" decoding="async">
      <h1 class="t r" style="top:35%" data-d="800"><span class="intro-title">یه سوال مهم؟</span></h1>
      <div class="t r" style="top:43.5%" data-d="2300">
        <svg class="orn" viewBox="0 0 100 10" aria-hidden="true"><line x1="0" y1="5" x2="43" y2="5"/><path d="M50 1 L55 5 L50 9 L45 5 Z"/><line x1="57" y1="5" x2="100" y2="5"/></svg>
      </div>
      <p class="t r intro-q" style="top:56.5%" data-d="3500"><span>به نظرت قشنگ‌ترین گل<br>کدومه؟</span></p>
      <div class="t r" style="top:76.5%" data-d="5200">
        <button class="btn" id="start" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span>یکی رو انتخاب کن</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ۲) انتخاب گل -->
  <section class="screen" id="s-choose" style="--ar:335/502" aria-label="انتخاب گل">
    <img class="bgfill" src="images/bg-choose.jpg" alt="" aria-hidden="true">
    <div class="canvas">
      <img class="bg" src="images/bg-choose.jpg" alt="" decoding="async">
      <h2 class="t r" style="top:10.2%" data-d="600"><span class="choose-title">یکی از این گل‌ها رو انتخاب کن</span></h2>
      <div class="t r" style="top:18.3%" data-d="1500">
        <svg class="orn" viewBox="0 0 100 10" aria-hidden="true"><line x1="0" y1="5" x2="43" y2="5"/><path d="M50 1 L55 5 L50 9 L45 5 Z"/><line x1="57" y1="5" x2="100" y2="5"/></svg>
      </div>
      <div class="grid" id="grid" role="group" aria-label="گل‌ها"></div>
    </div>
  </section>

  <!-- ۳ تا ۸) پاسخ اختصاصی هر گل و ۹) پیام نهایی با جاوااسکریپت ساخته می‌شوند -->
  <div id="dynamic"></div>

  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

<noscript><p class="noscript">برای دیدن این سورپرایز باید جاوااسکریپت فعال باشه.</p></noscript>
<script src="js/script.js"></script>
</body>
</html>
